# ==============================================================================
# model-download/gemma-4-31b/job.yaml
#
# Kubernetes Job: downloads google/gemma-4-31B-it from HuggingFace → S3.
# Treated as a gated model (defensive default for Google model repos) — HF
# token required. Token is pulled from Secrets Manager via ExternalSecret
# (k8s/download/hf-token-external-secret.yaml).
#
# Runtime values injected via envsubst by download.sh:
#   ${MODEL_BUCKET}  ${AWS_REGION}  ${DOWNLOAD_SERVICE_ACCOUNT}  ${BENCHMARK_NAMESPACE}
#
# Model info:
#   Repo  : google/gemma-4-31B-it (instruction-tuned checkpoint)
#   Size  : ~63 GB (31.3B params, dense, bf16 — no quantization)
#   Type  : Dense, text+image multimodal (vision encoder unused by this framework)
#
# Security hardening (Checkov CKV_K8S_*):
#   - Non-root user (UID 65534 / nobody)            [CKV_K8S_6,  CKV_K8S_40]
#   - readOnlyRootFilesystem: true                  [CKV_K8S_22]
#   - allowPrivilegeEscalation: false               [CKV_K8S_20]
#   - Capabilities: drop ALL, add none              [CKV_K8S_25, CKV_K8S_28]
#   - automountServiceAccountToken: false           [CKV_K8S_43]
#   - CPU + memory requests and limits set          [CKV_K8S_10, CKV_K8S_11]
#   - No hostPath, hostPID, hostIPC, hostNetwork    [CKV_K8S_14-19]
#   - HF token mounted as Secret volume (NOT env var)  [CKV_K8S_35]
#     Mounted read-only at /var/secrets/hf/token
#   - /tmp writable emptyDir (pip + HF cache + ~63 GB model staging)
# ==============================================================================

apiVersion: batch/v1
kind: Job
metadata:
  name: oai-infopt-download-gemma-4-31b
  namespace: ${BENCHMARK_NAMESPACE}
  labels:
    app.kubernetes.io/name: oai-infopt-download-gemma-4-31b
    app.kubernetes.io/component: model-download
    app.kubernetes.io/managed-by: kubectl
    project: observeai-inference-optimization
    engagement: shellkode-sow
    environment: sandbox
    model: gemma-4-31b
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 86400     # 24 h — model is ~63 GB
  ttlSecondsAfterFinished: 3600

  template:
    metadata:
      labels:
        app.kubernetes.io/name: oai-infopt-download-gemma-4-31b
        app.kubernetes.io/component: model-download
        project: observeai-inference-optimization
        engagement: shellkode-sow
        environment: sandbox
        model: gemma-4-31b
    spec:
      restartPolicy: Never
      serviceAccountName: ${DOWNLOAD_SERVICE_ACCOUNT}
      automountServiceAccountToken: false

      hostPID: false
      hostIPC: false
      hostNetwork: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 65534       # nobody
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: downloader
          # Image digest pinned 2026-09-03 — linux/amd64, resolves CKV_K8S_43.
          # Re-pin: see model-download/gpt-oss-20b/job.yaml header for one-liner.
          image: python:3.11-slim@sha256:d1053354624536b044162aaab1e418bd000ea35184fb1ae098ab3166b1072e72
          imagePullPolicy: IfNotPresent

          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail

              MODEL_ID="google/gemma-4-31B-it"
              MODEL_FOLDER="gemma-4-31B-it"
              LOCAL_DIR="/tmp/${MODEL_FOLDER}"

              echo "Model  : ${MODEL_ID}"
              echo "Bucket : s3://${MODEL_BUCKET}/${MODEL_FOLDER}/"
              echo "Token  : sourced from Secrets Manager via ESO"

              echo "Installing dependencies..."
              pip install --quiet --no-cache-dir \
                  --target /tmp/pip-packages \
                  huggingface_hub==0.24.7 boto3==1.34.0
              export PYTHONPATH="/tmp/pip-packages:${PYTHONPATH:-}"

              echo "Downloading from HuggingFace (gated model — token required)..."
              python3 -c "
              import os
              from huggingface_hub import snapshot_download
              try:
                  with open('/var/secrets/hf/token') as f:
                      token = f.read().strip()
              except FileNotFoundError:
                  raise RuntimeError('HF token file not found at /var/secrets/hf/token — check ExternalSecret sync status')
              if not token:
                  raise RuntimeError('HF token file is empty — check ExternalSecret sync status')
              snapshot_download(
                  repo_id='${MODEL_ID}',
                  local_dir='${LOCAL_DIR}',
                  token=token,
                  ignore_patterns=['*.msgpack','*.h5','flax_*','tf_*','rust_*'],
              )
              print('HF download complete.')
              "

              echo "Files downloaded:"
              ls -lah "${LOCAL_DIR}/"

              echo "Uploading to s3://${MODEL_BUCKET}/${MODEL_FOLDER}/ ..."
              python3 << 'PYEOF'
              import boto3
              import os
              from pathlib import Path

              s3 = boto3.client("s3", region_name=os.environ["AWS_DEFAULT_REGION"])
              bucket = os.environ["MODEL_BUCKET"]
              folder = "gemma-4-31B-it"
              local_dir = Path(f"/tmp/{folder}")

              files = [f for f in local_dir.rglob("*")
                       if f.is_file() and ".cache" not in f.parts]
              print(f"Uploading {len(files)} files...")
              for i, f in enumerate(files, 1):
                  key = f"{folder}/" + str(f.relative_to(local_dir))
                  size_mb = f.stat().st_size / 1_048_576
                  print(f"[{i}/{len(files)}] {f.name} ({size_mb:.1f} MB)")
                  s3.upload_file(str(f), bucket, key)
              print("Upload complete.")
              PYEOF

          env:
            - name: AWS_DEFAULT_REGION
              value: "${AWS_REGION}"
            - name: MODEL_BUCKET
              value: "${MODEL_BUCKET}"
            - name: HF_HUB_DISABLE_TELEMETRY
              value: "1"
            - name: HF_HUB_DISABLE_XET
              value: "1"
            - name: TRANSFORMERS_CACHE
              value: "/tmp/hf-cache"
            - name: HF_HOME
              value: "/tmp/hf-home"
            - name: PIP_NO_CACHE_DIR
              value: "1"

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault

          resources:
            requests:
              cpu: "4"
              memory: "16Gi"
            limits:
              cpu: "8"
              memory: "48Gi"

          volumeMounts:
            - name: tmp-workspace
              mountPath: /tmp
            # HF token mounted read-only from Secret (ESO-synced from Secrets Manager).
            # Avoids env-var exposure in kubectl describe / /proc/<pid>/environ.
            # Fixes CKV_K8S_35.
            - name: hf-token-vol
              mountPath: /var/secrets/hf
              readOnly: true

      volumes:
        # /tmp for pip, HF cache, and ~63 GB model staging before S3 upload
        - name: tmp-workspace
          emptyDir:
            sizeLimit: 160Gi
        # HF token Secret volume (created by ExternalSecret from Secrets Manager)
        # Apply k8s/download/hf-token-external-secret.yaml before running this Job.
        - name: hf-token-vol
          secret:
            secretName: hf-token
            defaultMode: 0440   # read-only for owner+group; no world read

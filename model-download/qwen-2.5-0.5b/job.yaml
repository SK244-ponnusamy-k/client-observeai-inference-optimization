# ==============================================================================
# model-download/qwen-2.5-0.5b/job.yaml
#
# Kubernetes Job: downloads Qwen/Qwen2.5-0.5B-Instruct from HuggingFace → S3.
# Model is public — no HF token required.
#
# Runtime values injected via envsubst by download.sh:
#   ${MODEL_BUCKET}  ${AWS_REGION}  ${DOWNLOAD_SERVICE_ACCOUNT}  ${BENCHMARK_NAMESPACE}
#
# Security hardening (Checkov CKV_K8S_*):
#   - Non-root user (UID 65534 / nobody)            [CKV_K8S_6,  CKV_K8S_40]
#   - readOnlyRootFilesystem: true                  [CKV_K8S_22]
#   - allowPrivilegeEscalation: false               [CKV_K8S_20]
#   - Capabilities: drop ALL, add none              [CKV_K8S_25, CKV_K8S_28]
#   - automountServiceAccountToken: false           [CKV_K8S_43]
#   - CPU + memory requests and limits set          [CKV_K8S_10, CKV_K8S_11]
#   - No hostPath, hostPID, hostIPC, hostNetwork    [CKV_K8S_14-19]
#   - /tmp writable emptyDir (pip + HF cache)
# ==============================================================================

apiVersion: batch/v1
kind: Job
metadata:
  name: oai-infopt-download-qwen-0.5b
  namespace: ${BENCHMARK_NAMESPACE}
  labels:
    app.kubernetes.io/name: oai-infopt-download-qwen-0.5b
    app.kubernetes.io/component: model-download
    app.kubernetes.io/managed-by: kubectl
    project: observeai-inference-optimization
    engagement: shellkode-sow
    environment: sandbox
    model: qwen-2.5-0.5b
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 7200      # 2 h — model is ~950 MB
  ttlSecondsAfterFinished: 3600

  template:
    metadata:
      labels:
        app.kubernetes.io/name: oai-infopt-download-qwen-0.5b
        app.kubernetes.io/component: model-download
        project: observeai-inference-optimization
        engagement: shellkode-sow
        environment: sandbox
        model: qwen-2.5-0.5b
    spec:
      restartPolicy: Never
      serviceAccountName: ${DOWNLOAD_SERVICE_ACCOUNT}
      automountServiceAccountToken: false

      # No privileged access needed
      hostPID: false
      hostIPC: false
      hostNetwork: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 65534       # nobody
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault  # enables default seccomp filtering

      containers:
        - name: downloader
          # Image digest pinned 2026-09-03 — linux/amd64, resolves CKV_K8S_43.
          # Re-pin: see model-download/gpt-oss-20b/job.yaml header for one-liner.
          image: python:3.11-slim@sha256:d1053354624536b044162aaab1e418bd000ea35184fb1ae098ab3166b1072e72
          imagePullPolicy: IfNotPresent

          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail

              MODEL_ID="Qwen/Qwen2.5-0.5B-Instruct"
              MODEL_FOLDER="Qwen2.5-0.5B-Instruct"
              LOCAL_DIR="/tmp/${MODEL_FOLDER}"

              echo "Model  : ${MODEL_ID}"
              echo "Bucket : s3://${MODEL_BUCKET}/${MODEL_FOLDER}/"

              echo "Installing dependencies..."
              pip install --quiet --no-cache-dir huggingface_hub==0.24.7 boto3==1.34.0

              echo "Downloading from HuggingFace..."
              python3 -c "
              from huggingface_hub import snapshot_download
              snapshot_download(
                  repo_id='${MODEL_ID}',
                  local_dir='${LOCAL_DIR}',
                  ignore_patterns=['*.msgpack','*.h5','flax_*','tf_*','rust_*'],
              )
              print('HF download complete.')
              "

              echo "Files downloaded:"
              ls -lah "${LOCAL_DIR}/"

              echo "Uploading to s3://${MODEL_BUCKET}/${MODEL_FOLDER}/ ..."
              python3 << 'PYEOF'
              import boto3
              import os
              from pathlib import Path

              s3 = boto3.client("s3", region_name=os.environ["AWS_DEFAULT_REGION"])
              bucket = os.environ["MODEL_BUCKET"]
              folder = "Qwen2.5-0.5B-Instruct"
              local_dir = Path(f"/tmp/{folder}")

              files = [f for f in local_dir.rglob("*")
                       if f.is_file() and ".cache" not in f.parts]
              print(f"Uploading {len(files)} files...")
              for i, f in enumerate(files, 1):
                  key = f"{folder}/" + str(f.relative_to(local_dir))
                  size_mb = f.stat().st_size / 1_048_576
                  print(f"[{i}/{len(files)}] {f.name} ({size_mb:.1f} MB)")
                  s3.upload_file(str(f), bucket, key)
              print("Upload complete.")
              PYEOF

          env:
            - name: AWS_DEFAULT_REGION
              value: "${AWS_REGION}"
            - name: MODEL_BUCKET
              value: "${MODEL_BUCKET}"
            - name: HF_HUB_DISABLE_XET
              value: "1"
            - name: HF_HUB_DISABLE_TELEMETRY
              value: "1"
            - name: TRANSFORMERS_CACHE
              value: "/tmp/hf-cache"
            - name: HF_HOME
              value: "/tmp/hf-home"
            - name: PIP_NO_CACHE_DIR
              value: "1"

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault

          resources:
            requests:
              cpu: "2"
              memory: "8Gi"
            limits:
              cpu: "4"
              memory: "16Gi"

          volumeMounts:
            - name: tmp-workspace
              mountPath: /tmp

      volumes:
        # Writable /tmp for pip install, HF cache, and model staging
        - name: tmp-workspace
          emptyDir:
            sizeLimit: 10Gi   # ~950 MB model + pip + HF cache headroom

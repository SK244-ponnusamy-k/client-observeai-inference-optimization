# ==============================================================================
# vllm/models/gpt-oss-20b/deployment.yaml
#
# Model     : openai/gpt-oss-20b
# S3 path   : s3://shellkode-ai-models/gpt-oss-20b/
# Size      : ~13 GB (MXFP4 quantized) | VRAM: ~16 GB
# GPU       : g6e.2xlarge (32GB RAM) — auto-provisioned by Karpenter
# Notes     : MoE — 21B total params, 3.6B active per token
#             Chain-of-thought reasoning via harmony format
#
# Deployment name: vllm-gpt-oss-20b  (unique — can run alongside other models)
# Service name   : vllm-gpt-oss-20b
# Port-forward   : kubectl port-forward svc/vllm-gpt-oss-20b 8081:8000 &
# ==============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-gpt-oss-20b
  namespace: default
  labels:
    app: vllm-gpt-oss-20b
    model: gpt-oss-20b
    component: inference-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-gpt-oss-20b
  template:
    metadata:
      labels:
        app: vllm-gpt-oss-20b
        model: gpt-oss-20b
        component: inference-server
    spec:
      serviceAccountName: model-storage-sa
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      terminationGracePeriodSeconds: 120

      containers:
        - name: vllm
          image: public.ecr.aws/deep-learning-containers/vllm:0.21.0-gpu-py312-cu130-ubuntu22.04-ec2-v1.0-soci
          args:
            - "--model=s3://shellkode-ai-models/gpt-oss-20b/"
            - "--load-format=runai_streamer"
            - "--host=0.0.0.0"
            - "--port=8000"
            - "--served-model-name=gpt-oss-20b"
            - "--gpu-memory-utilization=0.90"
            - "--max-model-len=4096"
            - "--trust-remote-code"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: AWS_DEFAULT_REGION
              value: "us-east-2"
          # Needs g6e.2xlarge (32GB RAM) — g6e.xlarge OOMs during startup
          resources:
            requests:
              cpu: "4"
              memory: "24Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: "30Gi"
              nvidia.com/gpu: "1"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 300
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 360
            periodSeconds: 30
            failureThreshold: 10
          volumeMounts:
            - name: metadata-cache
              mountPath: /metadata
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: metadata-cache
          persistentVolumeClaim:
            claimName: metadata-cache-gpt-oss-20b
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi

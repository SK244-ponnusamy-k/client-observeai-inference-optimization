# ==============================================================================
# vllm/models/gpt-oss-20b-neuron/compile-job.yaml  - GENERATED by `oai model generate gpt-oss-20b-neuron`
#
# Compiles openai/gpt-oss-20b (bf16) -> Neuron NEFF artifacts, cached in S3 so serving
# does not recompile every run. Compile parameters are LOCKED at compile time -
# changing cores/seq/batch requires a full recompile.
#
# Runtime values injected via envsubst by deploy.sh:
#   ${BENCHMARK_NAMESPACE} ${DOWNLOAD_SERVICE_ACCOUNT}
#   ${MODEL_BUCKET} ${AWS_REGION} ${NEURON_COMPILE_IMAGE}
# ==============================================================================

apiVersion: batch/v1
kind: Job
metadata:
  name: oai-infopt-neuron-compile-gpt-oss-20b-neuron
  namespace: ${BENCHMARK_NAMESPACE}
  labels:
    app.kubernetes.io/name: oai-infopt-neuron-compile-gpt-oss-20b-neuron
    app.kubernetes.io/component: neuron-compile
    app.kubernetes.io/managed-by: oai-cli
    project: observeai-inference-optimization
    engagement: shellkode-sow
    environment: sandbox
    model: gpt-oss-20b-neuron
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 43200
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oai-infopt-neuron-compile-gpt-oss-20b-neuron
        app.kubernetes.io/component: neuron-compile
        project: observeai-inference-optimization
        engagement: shellkode-sow
        environment: sandbox
        model: gpt-oss-20b-neuron
    spec:
      restartPolicy: Never
      serviceAccountName: ${DOWNLOAD_SERVICE_ACCOUNT}
      automountServiceAccountToken: false
      hostPID: false
      hostIPC: false
      hostNetwork: false
      # Managed node group places the trn2 node; it stamps the nodegroup label,
      # NOT eks.amazonaws.com/instance-family (that is a Karpenter label). Select
      # on the nodegroup so this compile pod lands on the trn2-neuron node — same
      # selector the managed-ng serving deployment uses.
      nodeSelector:
        eks.amazonaws.com/nodegroup: trn2-neuron
      tolerations:
        - key: aws.amazon.com/neuron
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: neuron-compile
          image: ${NEURON_COMPILE_IMAGE}
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              SRC_FOLDER="gpt-oss-20b"
              NEFF_FOLDER="gpt-oss-20b-neuron"
              # LNC=2, TP=4: 4 logical cores (each fuses 2 physical NeuronCores on trn2).
              export NEURON_LOGICAL_NC_CONFIG="2"
              NEURON_CORES="4"
              SEQ_LEN="8192"
              # BATCH = top num_seqs bucket. Recompile pass 1 = 32, follow-up pass 2 = 64.
              BATCH="32"
              SRC_S3="s3://${MODEL_BUCKET}/${SRC_FOLDER}/"
              DST_S3="s3://${MODEL_BUCKET}/${NEFF_FOLDER}/"
              WORK_DIR="/tmp/model"; NEFF_DIR="/tmp/neff"

              echo "Compile gpt-oss-20b-neuron: ${SRC_S3} -> ${DST_S3} (LNC=${NEURON_LOGICAL_NC_CONFIG}, cores/TP=${NEURON_CORES}, seq=${SEQ_LEN}, batch=${BATCH})"

              echo "[1/4] Checking S3 NEFF cache..."
              if aws s3 ls "${DST_S3}" --region "${AWS_DEFAULT_REGION}" 2>/dev/null | grep -q .; then
                echo "NEFF cache already present at ${DST_S3} - skipping recompile."
                echo "Force recompile with: aws s3 rm ${DST_S3} --recursive"
                exit 0
              fi

              echo "[2/4] Syncing bf16 weights from S3..."
              mkdir -p "${WORK_DIR}" "${NEFF_DIR}"
              aws s3 sync "${SRC_S3}" "${WORK_DIR}/" --region "${AWS_DEFAULT_REGION}" --no-progress

              echo "[3/4] Installing optimum-neuron and compiling to NEFF..."
              pip install --quiet optimum-neuron
              export PATH="/tmp/.local/bin:${PATH}"
              optimum-cli export neuron \
                --model "${WORK_DIR}" \
                --sequence_length "${SEQ_LEN}" \
                --batch_size "${BATCH}" \
                --num_cores "${NEURON_CORES}" \
                --auto_cast_type bf16 \
                --task text-generation \
                "${NEFF_DIR}"

              echo "[4/4] Uploading NEFF artifacts to S3..."
              aws s3 sync "${NEFF_DIR}/" "${DST_S3}" --region "${AWS_DEFAULT_REGION}" --no-progress
              echo "Compile complete. NEFF at ${DST_S3}"
          env:
            - name: AWS_DEFAULT_REGION
              value: "${AWS_REGION}"
            - name: MODEL_BUCKET
              value: "${MODEL_BUCKET}"
            - name: NEURONX_CACHE
              value: "/tmp/neuronx_cache"
            - name: HOME
              value: "/tmp"
          securityContext:
            allowPrivilegeEscalation: false
            # false: pip install + neuronx-cc write to the filesystem during compile.
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          # Compile is Neuron-bound (neuronx-cc runs on the NeuronCores); the
          # container itself only drives the S3 sync + pip install + CLI, so a
          # modest vCPU/RAM request is enough. Keep requests small so the pod
          # fits trn2.3xlarge's allocatable CPU (the 16-vCPU request did not fit);
          # limits stay higher for burst during the sync/compile.
          # trn2.3xlarge allocatable is ~11.9 vCPU / ~124Gi (verified on-node),
          # NOT the full instance spec — the kubelet/system reserve the rest.
          # Keep request small and the limit UNDER allocatable so the pod fits.
          resources:
            requests:
              cpu: "4"
              memory: "24Gi"
              aws.amazon.com/neuron: "1"
            limits:
              cpu: "10"
              memory: "96Gi"
              aws.amazon.com/neuron: "1"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 150Gi

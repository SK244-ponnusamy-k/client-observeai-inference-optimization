# ==============================================================================
# vllm/models/gpt-oss-20b-neuron/deployment.yaml  - GENERATED by `oai model generate gpt-oss-20b-neuron`
#
# Neuron serve stage. An init container syncs bf16 weights S3 -> /model, then
# vLLM-Neuron serves from the local path (the Neuron DLC has no runai streamer).
#
# nodeSelector uses instance-family (Karpenter). For the managed node-group
# fallback see deployment-managed-ng.yaml (generated alongside this file).
#
# Runtime values injected via envsubst by deploy.sh:
#   ${BENCHMARK_NAMESPACE} ${NEURON_VLLM_IMAGE} ${MODEL_BUCKET}
#   ${MODEL_FOLDER} ${MODEL_HF_ID} ${SERVED_NAME} ${NEURON_CORES}
# ==============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: oai-infopt-vllm-gpt-oss-20b-neuron
  namespace: ${BENCHMARK_NAMESPACE}
  labels:
    app.kubernetes.io/name: oai-infopt-vllm-gpt-oss-20b-neuron
    app.kubernetes.io/component: inference-server
    app.kubernetes.io/managed-by: oai-cli
    app.kubernetes.io/version: "gpt-oss-20b-neuron"
    project: observeai-inference-optimization
    engagement: shellkode-sow
    environment: sandbox
    model: gpt-oss-20b-neuron
    source: neuron
  annotations:
    checkov.io/skip1: "CKV_K8S_43=Image digest pinned in NEURON_VLLM_IMAGE via config/config.env"
    checkov.io/skip2: "CKV_K8S_14=Image tag pinned in NEURON_VLLM_IMAGE; static analysis cannot resolve envsubst"
    checkov.io/skip3: "CKV_K8S_15=imagePullPolicy IfNotPresent acceptable with pinned image"
    checkov.io/skip4: "CKV_K8S_40=runAsUser 1000 pending vLLM-Neuron UID compatibility test"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: oai-infopt-vllm-gpt-oss-20b-neuron
  template:
    metadata:
      labels:
        app: oai-infopt-vllm-gpt-oss-20b-neuron
        app.kubernetes.io/name: oai-infopt-vllm-gpt-oss-20b-neuron
        app.kubernetes.io/component: inference-server
        project: observeai-inference-optimization
        engagement: shellkode-sow
        environment: sandbox
        model: gpt-oss-20b-neuron
        source: neuron
    spec:
      serviceAccountName: oai-infopt-serving-sa
      automountServiceAccountToken: false
      hostPID: false
      hostIPC: false
      hostNetwork: false

      nodeSelector:
        eks.amazonaws.com/instance-family: trn2

      tolerations:
        - key: aws.amazon.com/neuron
          operator: Exists
          effect: NoSchedule
        - key: CriticalAddonsOnly
          operator: Exists

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: benchmark-runner
                topologyKey: kubernetes.io/hostname

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      terminationGracePeriodSeconds: 180

      initContainers:
        - name: model-sync
          image: amazon/aws-cli:2.15.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |
              echo "Syncing weights from s3://${MODEL_BUCKET}/${MODEL_FOLDER}/ -> /model/"
              aws s3 sync "s3://${MODEL_BUCKET}/${MODEL_FOLDER}/" /model/ \
                --region "${AWS_DEFAULT_REGION}" --no-progress
              echo "Sync complete. Files:"; ls -lh /model/
              test -f /model/config.json && echo "config.json OK" || { echo "ERROR: config.json missing"; exit 1; }
          env:
            - name: AWS_DEFAULT_REGION
              value: "${AWS_REGION}"
            - name: MODEL_BUCKET
              value: "${MODEL_BUCKET}"
            - name: MODEL_FOLDER
              value: "${MODEL_FOLDER}"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: "4"
              memory: "8Gi"
            limits:
              cpu: "8"
              memory: "16Gi"
          volumeMounts:
            - name: model-weights
              mountPath: /model

      containers:
        - name: vllm-neuron
          image: ${NEURON_VLLM_IMAGE}
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |
              echo "vLLM-Neuron serving  model=/model  LNC=${NEURON_LOGICAL_NC_CONFIG}  cores/TP=${NEURON_CORES}"
              NEURON_SKIP_EFA_AFFINITY=1 vllm serve /model \
                --served-model-name "${SERVED_NAME}" \
                --max-model-len 8192 \
                --max-num-batched-tokens 4096 \
                --max-num-seqs 64 \
                --tensor-parallel-size "${NEURON_CORES}" \
                --block-size 8 \
                --enable-prefix-caching \
                --no-disable-hybrid-kv-cache-manager \
                --hf-overrides '{"quantization_config": {}}' \
                --additional-config '{"neuron_config": {"num_batched_tokens_buckets": [4096], "num_seqs_buckets": [1, 2, 4, 8, 16, 32, 64]}}' \
                --port 8000
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: HOME
              value: "/tmp"
            - name: USER
              value: "vllm"
            - name: MODEL_BUCKET
              value: "${MODEL_BUCKET}"
            - name: MODEL_FOLDER
              value: "${MODEL_FOLDER}"
            - name: SERVED_NAME
              value: "${SERVED_NAME}"
            - name: NEURON_CORES
              value: "${NEURON_CORES}"
            # LNC=2 explicit: must match the compile-time value exactly.
            - name: NEURON_LOGICAL_NC_CONFIG
              value: "2"
            - name: NEURONX_CACHE
              value: "/tmp/neuronx_cache"
            - name: NEURON_RT_NUM_CORES
              value: "${NEURON_CORES}"
            - name: NEURON_COMPILE_CACHE_URL
              value: "/tmp/neuron-compiled-artifacts"
            - name: AWS_DEFAULT_REGION
              value: "${AWS_REGION}"
            # Compilation and execution timeouts for gpt-oss MoE (per AWS docs)
            - name: VLLM_NEURON_COMPILATION_TIMEOUT
              value: "1200"
            - name: VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS
              value: "1200"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: "48"
              memory: "256Gi"
              aws.amazon.com/neuron: "4"
            limits:
              cpu: "96"
              memory: "512Gi"
              aws.amazon.com/neuron: "4"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 600
            periodSeconds: 15
            failureThreshold: 480
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 720
            periodSeconds: 30
            failureThreshold: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: model-weights
              mountPath: /model
            - name: dshm
              mountPath: /dev/shm
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: model-weights
          emptyDir:
            sizeLimit: 60Gi
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
        - name: tmp
          emptyDir:
            sizeLimit: 100Gi

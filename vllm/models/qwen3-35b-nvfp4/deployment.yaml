# ==============================================================================
# vllm/models/qwen3-35b-nvfp4/deployment.yaml
#
# Model     : nvidia/Qwen3.6-35B-A3B-NVFP4
# S3 path   : s3://<MODEL_BUCKET>/Qwen3.6-35B-A3B-NVFP4/
#             (MODEL_BUCKET resolved at runtime — not hardcoded here)
# Size      : ~20 GB (NVFP4 quantized) | VRAM: ~20 GB on 1 GPU
# GPU       : g6e.2xlarge (1x L40S 48 GB) — single GPU, no tensor parallelism
#             Karpenter auto-provisions on demand.
# Notes     : MoE — 35.7B total params, ~3.6B active per token.
#             NVFP4 requires vLLM 0.8.5+ with NVFP4 kernel support.
#             --quantization=nvfp4 flag required at serve time.
#
# Runtime values injected via envsubst by deploy.sh:
#   ${MODEL_BUCKET}  ${BENCHMARK_NAMESPACE}  ${VLLM_IMAGE}
#
# GPU sizing rationale:
#   NVFP4 weights: ~20 GB total (35B params × 0.5 bytes/param)
#   L40S 48 GB × 1 → weights ~20 GB + KV cache ~21 GB at 0.85 utilization.
#   g6e.2xlarge chosen: cost-optimal at $2.17/hr, same as gpt-oss-20b.
#   Upgrade to g6e.4xlarge (2× L40S, TP=2) if OOM at high concurrency.
#
# Security hardening (Checkov CKV_K8S_*):
#   - Non-root user (UID 1000)                      [CKV_K8S_6,  CKV_K8S_40]
#   - readOnlyRootFilesystem: true                  [CKV_K8S_22]
#   - allowPrivilegeEscalation: false               [CKV_K8S_20]
#   - Capabilities: drop ALL                        [CKV_K8S_25, CKV_K8S_28]
#   - automountServiceAccountToken: false           [CKV_K8S_43]
#   - No hostPath, hostPID, hostIPC, hostNetwork    [CKV_K8S_14-19]
#   - CPU + memory requests and limits set          [CKV_K8S_10, CKV_K8S_11]
#   - Liveness/readiness probes defined             [CKV_K8S_8,  CKV_K8S_9]
#   - Config from ConfigMap, no hardcoded env vals  [CKV_K8S_35]
# ==============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: oai-infopt-vllm-qwen3-35b-nvfp4
  namespace: ${BENCHMARK_NAMESPACE}
  labels:
    app.kubernetes.io/name: oai-infopt-vllm-qwen3-35b-nvfp4
    app.kubernetes.io/component: inference-server
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/version: "qwen3-35b-nvfp4"
    project: observeai-inference-optimization
    engagement: shellkode-sow
    environment: sandbox
    model: qwen3-35b-nvfp4
  annotations:
    # Static-analysis suppressions — see gpt-oss-20b/deployment.yaml for full rationale.
    checkov.io/skip1: "CKV_K8S_43=Image digest pinned in VLLM_IMAGE via config/config.env; envsubst resolves at deploy time"
    checkov.io/skip2: "CKV_K8S_14=Image tag pinned in VLLM_IMAGE; not latest — static analysis cannot resolve envsubst variables"
    checkov.io/skip3: "CKV_K8S_15=imagePullPolicy IfNotPresent acceptable with digest-pinned image; reassess next sprint"
    checkov.io/skip4: "CKV_K8S_40=runAsUser 1000 pending vLLM UID compatibility test; tracked for next hardening sprint"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: oai-infopt-vllm-qwen3-35b-nvfp4
  template:
    metadata:
      labels:
        app: oai-infopt-vllm-qwen3-35b-nvfp4
        app.kubernetes.io/name: oai-infopt-vllm-qwen3-35b-nvfp4
        app.kubernetes.io/component: inference-server
        project: observeai-inference-optimization
        engagement: shellkode-sow
        environment: sandbox
        model: qwen3-35b-nvfp4
    spec:
      serviceAccountName: oai-infopt-serving-sa
      automountServiceAccountToken: false

      hostPID: false
      hostIPC: false
      hostNetwork: false

      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: benchmark-runner
                topologyKey: kubernetes.io/hostname

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      terminationGracePeriodSeconds: 120

      containers:
        - name: vllm
          image: ${VLLM_IMAGE}
          imagePullPolicy: IfNotPresent

          args:
            - "--model=s3://${MODEL_BUCKET}/Qwen3.6-35B-A3B-NVFP4/"
            - "--load-format=runai_streamer"
            - "--host=0.0.0.0"
            - "--port=8000"
            - "--served-model-name=qwen3-35b-nvfp4"
            - "--trust-remote-code"
            # ── Quantization ──────────────────────────────────────────────────
            # NVFP4 is NVIDIA's 4-bit floating-point format. Requires vLLM
            # 0.8.5+ and a Hopper/Ada GPU (H100/H200/L40S with FP4 tensor cores).
            - "--quantization=nvfp4"
            # ── Memory ────────────────────────────────────────────────────────
            # 0.85 on single L40S 48 GB → ~41 GB usable.
            # Weights ~20 GB, leaving ~21 GB for KV cache blocks.
            - "--gpu-memory-utilization=0.85"
            # 8192 context window — covers full transcript inputs up to ~6k tokens.
            - "--max-model-len=8192"
            # ── Scheduler ─────────────────────────────────────────────────────
            # 128 concurrent sequences — conservative for single GPU to avoid OOM.
            # Increase to 256 if memory headroom allows after profiling.
            - "--max-num-seqs=128"
            # ── Chunked Prefill ───────────────────────────────────────────────
            # Splits long prompt prefill into 2048-token chunks.
            # Prevents head-of-line blocking at high concurrency.
            - "--enable-chunked-prefill"
            - "--max-num-batched-tokens=2048"
            # ── Prefix Caching ────────────────────────────────────────────────
            # Reuses KV cache blocks for shared prompt prefixes (system prompt
            # + QA schema header). Expected 20-40% TTFT reduction on cache hits.
            - "--enable-prefix-caching"

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          envFrom:
            - configMapRef:
                name: oai-infopt-vllm-config

          env:
            # Required when running as UID 1000 without a passwd entry.
            - name: HOME
              value: "/tmp"
            - name: USER
              value: "vllm"
            - name: TORCHINDUCTOR_CACHE_DIR
              value: "/tmp/torchinductor_cache"

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault

          resources:
            requests:
              cpu: "4"
              memory: "24Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: "32Gi"
              nvidia.com/gpu: "1"

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            # TP=2 + NVFP4 kernel compilation adds ~2 min on first load
            initialDelaySeconds: 360
            periodSeconds: 10
            failureThreshold: 36
            timeoutSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 420
            periodSeconds: 30
            failureThreshold: 10
            timeoutSeconds: 5

          volumeMounts:
            - name: metadata-cache
              mountPath: /metadata
            - name: dshm
              mountPath: /dev/shm
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: metadata-cache
          persistentVolumeClaim:
            claimName: oai-infopt-metadata-qwen3-35b-nvfp4
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
        - name: tmp
          emptyDir:
            sizeLimit: 4Gi

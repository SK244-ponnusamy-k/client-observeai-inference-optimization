# ==============================================================================
# vllm/models/qwen-2.5-0.5b/deployment.yaml
#
# Model     : Qwen/Qwen2.5-0.5B-Instruct
# S3 path   : s3://<MODEL_BUCKET>/models/Qwen2.5-0.5B-Instruct/
#             (MODEL_BUCKET resolved at runtime — not hardcoded here)
# Size      : ~950 MB | VRAM: ~2 GB
# GPU       : g6e.xlarge (1x L40S 48 GB) — auto-provisioned by Karpenter
#
# Runtime values injected via envsubst by deploy.sh:
#   ${MODEL_BUCKET}  ${BENCHMARK_NAMESPACE}  ${VLLM_IMAGE}
#
# Security hardening (Checkov CKV_K8S_*):
#   - Non-root user (UID 1000)                      [CKV_K8S_6,  CKV_K8S_40]
#   - readOnlyRootFilesystem: true                  [CKV_K8S_22]
#   - allowPrivilegeEscalation: false               [CKV_K8S_20]
#   - Capabilities: drop ALL                        [CKV_K8S_25, CKV_K8S_28]
#   - automountServiceAccountToken: false           [CKV_K8S_43]
#   - No hostPath, hostPID, hostIPC, hostNetwork    [CKV_K8S_14-19]
#   - CPU + memory requests and limits set          [CKV_K8S_10, CKV_K8S_11]
#   - Liveness/readiness probes defined             [CKV_K8S_8,  CKV_K8S_9]
#   - Config from ConfigMap, no hardcoded env vals  [CKV_K8S_35]
# ==============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: oai-infopt-vllm-qwen-0.5b
  namespace: ${BENCHMARK_NAMESPACE}
  labels:
    app.kubernetes.io/name: oai-infopt-vllm-qwen-0.5b
    app.kubernetes.io/component: inference-server
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/version: "qwen-2.5-0.5b"
    project: observeai-inference-optimization
    engagement: shellkode-sow
    environment: sandbox
    model: qwen-2.5-0.5b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oai-infopt-vllm-qwen-0.5b
  template:
    metadata:
      labels:
        app: oai-infopt-vllm-qwen-0.5b
        app.kubernetes.io/name: oai-infopt-vllm-qwen-0.5b
        app.kubernetes.io/component: inference-server
        project: observeai-inference-optimization
        engagement: shellkode-sow
        environment: sandbox
        model: qwen-2.5-0.5b
    spec:
      serviceAccountName: oai-infopt-serving-sa
      automountServiceAccountToken: false

      hostPID: false
      hostIPC: false
      hostNetwork: false

      # Schedule on GPU nodes only
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule

      # Ensure benchmark runner does NOT co-locate with GPU pod
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: benchmark-runner
                topologyKey: kubernetes.io/hostname

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      terminationGracePeriodSeconds: 60

      containers:
        - name: vllm
          # Image pinned per run via VLLM_IMAGE in config.env / deploy.sh
          image: ${VLLM_IMAGE}
          imagePullPolicy: IfNotPresent

          args:
            - "--model=s3://${MODEL_BUCKET}/Qwen2.5-0.5B-Instruct/"
            - "--load-format=runai_streamer"
            - "--host=0.0.0.0"
            - "--port=8000"
            - "--served-model-name=qwen-2.5-0.5b"
            - "--gpu-memory-utilization=0.90"
            - "--max-model-len=4096"

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          # Non-secret config from ConfigMap; no raw env values in this file
          envFrom:
            - configMapRef:
                name: oai-infopt-vllm-config

          env:
            - name: HOME
              value: "/tmp"
            - name: USER
              value: "vllm"
            - name: TORCHINDUCTOR_CACHE_DIR
              value: "/tmp/torchinductor_cache"

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault

          resources:
            requests:
              cpu: "2"
              memory: "8Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: "14Gi"
              nvidia.com/gpu: "1"

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 12
            timeoutSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 90
            periodSeconds: 30
            failureThreshold: 5
            timeoutSeconds: 5

          volumeMounts:
            - name: metadata-cache
              mountPath: /metadata
            - name: dshm
              mountPath: /dev/shm
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: metadata-cache
          persistentVolumeClaim:
            claimName: oai-infopt-metadata-qwen-0.5b
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
        # /tmp needed by vLLM process (readOnlyRootFilesystem requires explicit mount)
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi

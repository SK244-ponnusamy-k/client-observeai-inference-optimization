# ==============================================================================
# vllm/models/qwen-2.5-0.5b/deployment.yaml
#
# Model     : Qwen/Qwen2.5-0.5B-Instruct
# S3 path   : s3://shellkode-ai-models/Qwen2.5-0.5B-Instruct/
# Size      : ~950 MB | VRAM: ~2 GB
# GPU       : g6e.xlarge (1x L40S 48GB) — auto-provisioned by Karpenter
# TTFT      : ~15-20ms (in-cluster)
#
# Deployment name: vllm-qwen-0.5b  (unique — can run alongside other models)
# Service name   : vllm-qwen-0.5b
# Port-forward   : kubectl port-forward svc/vllm-qwen-0.5b 8080:8000 &
# ==============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-qwen-0.5b
  namespace: default
  labels:
    app: vllm-qwen-0.5b
    model: qwen-2.5-0.5b
    component: inference-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-qwen-0.5b
  template:
    metadata:
      labels:
        app: vllm-qwen-0.5b
        model: qwen-2.5-0.5b
        component: inference-server
    spec:
      serviceAccountName: model-storage-sa
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      terminationGracePeriodSeconds: 60

      containers:
        - name: vllm
          image: public.ecr.aws/deep-learning-containers/vllm:0.21.0-gpu-py312-cu130-ubuntu22.04-ec2-v1.0-soci
          args:
            - "--model=s3://shellkode-ai-models/Qwen2.5-0.5B-Instruct/"
            - "--load-format=runai_streamer"
            - "--host=0.0.0.0"
            - "--port=8000"
            - "--served-model-name=qwen-0.5b"
            - "--gpu-memory-utilization=0.90"
            - "--max-model-len=4096"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: AWS_DEFAULT_REGION
              value: "us-east-2"
          # Qwen 0.5B — fits on g6e.xlarge (4 vCPU / 16GB RAM)
          resources:
            requests:
              cpu: "2"
              memory: "8Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: "14Gi"
              nvidia.com/gpu: "1"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 90
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: metadata-cache
              mountPath: /metadata
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: metadata-cache
          persistentVolumeClaim:
            claimName: metadata-cache-qwen-0.5b
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi

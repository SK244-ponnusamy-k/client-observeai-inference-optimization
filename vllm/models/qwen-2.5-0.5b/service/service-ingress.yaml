# ==============================================================================
# service-ingress.yaml — HTTPS Ingress via AWS ALB (Production)
#
# Exposes vLLM at https://qwen.yourdomain.com with SSL termination.
# Requires: AWS Load Balancer Controller + ACM certificate.
#
# Edit before applying:
#   - Replace YOUR-ACM-CERT-ARN with actual ARN
#   - Replace qwen.yourdomain.com with your domain
#
# Apply:
#   kubectl apply -f vllm/models/qwen-2.5-0.5b/service/service-ingress.yaml
# ==============================================================================

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vllm-qwen-0.5b-ingress
  namespace: default
  labels:
    app: vllm-qwen-0.5b
    model: qwen-2.5-0.5b
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    # ── REPLACE WITH YOUR ACM CERTIFICATE ARN ─────────────
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-2:ACCOUNT_ID:certificate/YOUR-CERT-ID
    # ──────────────────────────────────────────────────────
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=300
spec:
  rules:
    # ── REPLACE WITH YOUR DOMAIN ──────────────────────────
    - host: qwen.yourdomain.com
    # ──────────────────────────────────────────────────────
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: vllm-qwen-0.5b
                port:
                  number: 8000
          - path: /health
            pathType: Exact
            backend:
              service:
                name: vllm-qwen-0.5b
                port:
                  number: 8000

spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: oai-infopt-vllm-qwen3-5-9b-tp4
  template:
    metadata:
      labels:
        app: oai-infopt-vllm-qwen3-5-9b-tp4
        app.kubernetes.io/name: oai-infopt-vllm-qwen3-5-9b-tp4
        app.kubernetes.io/component: inference-server
        project: observeai-inference-optimization
        engagement: shellkode-sow
        environment: sandbox
        model: qwen3-5-9b-tp4
    spec:
      serviceAccountName: oai-infopt-serving-sa
      automountServiceAccountToken: false

      hostPID: false
      hostIPC: false
      hostNetwork: false

      # Hardware pin - the matrix knob (deploy.sh --hw). Ties each result row to
      # an exact GPU family/size.
      nodeSelector:
        node.kubernetes.io/instance-type: ${NODE_INSTANCE_TYPE}

      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: benchmark-runner
                topologyKey: kubernetes.io/hostname

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      terminationGracePeriodSeconds: 120

      containers:
        - name: vllm
          image: ${VLLM_IMAGE}
          imagePullPolicy: IfNotPresent

          args:
            - "--model=s3://${MODEL_BUCKET}/${MODEL_FOLDER}/"
            - "--load-format=runai_streamer"
            - "--host=0.0.0.0"
            - "--port=8000"
            - "--served-model-name=${SERVED_NAME}"
            - "--tensor-parallel-size=${TP_SIZE}"
            - "--gpu-memory-utilization=0.9"
            - "--max-model-len=16384"
            - "--max-num-seqs=1024"

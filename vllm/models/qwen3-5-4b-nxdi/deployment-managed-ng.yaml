# ==============================================================================
# vllm/models/qwen3-5-4b-nxdi/deployment.yaml
#
# NxDI serve stage for Qwen3.5-4B (hybrid DeltaNet + GQA).
#
# vLLM-Neuron cannot load this architecture, so instead of `vllm serve` this
# runs the vendored reference modeling code behind an OpenAI-compatible FastAPI
# shim (server.py) on :8000. Downstream benchmark/observability/teardown are
# identical to the vLLM path because the HTTP contract is identical.
#
# Init flow:
#   1. code-assemble : build /app package layout from code ConfigMaps
#   2. model-sync    : sync bf16 weights + compiled NxDI artifact from S3
# Then the main container runs `python3 server.py`, which loads the cached
# compiled artifact (or compiles on first boot if absent) and serves.
#
# Managed node-group path — nodeSelector targets the trn2 node group.
# Used with:  bash deploy.sh --managed-ng
#
# Runtime values injected via envsubst by deploy.sh:
#   ${BENCHMARK_NAMESPACE} ${NEURON_NXDI_IMAGE} ${MODEL_BUCKET} ${SOURCE_FOLDER}
#   ${COMPILED_FOLDER} ${SERVED_NAME} ${NEURON_CORES} ${NEURON_DEVICE_COUNT}
#   ${AWS_REGION} ${S3_BUCKET_REGION} ${INSTANCE_FAMILY}
#   ${QWEN35_SEQ_LEN} ${QWEN35_MAX_BATCH_SIZE} ${QWEN35_TP_DEGREE}
#   ${QWEN35_LOGICAL_NC_CONFIG} ${QWEN35_TORCH_DTYPE} ${QWEN35_TOP_K_ON_DEVICE}
# ==============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: oai-infopt-vllm-qwen3-5-4b-nxdi
  namespace: ${BENCHMARK_NAMESPACE}
  labels:
    app.kubernetes.io/name: oai-infopt-vllm-qwen3-5-4b-nxdi
    app.kubernetes.io/component: inference-server
    app.kubernetes.io/managed-by: oai-cli
    app.kubernetes.io/version: "qwen3-5-4b-nxdi"
    project: observeai-inference-optimization
    engagement: shellkode-sow
    environment: sandbox
    model: qwen3-5-4b-nxdi
    source: neuron
  annotations:
    checkov.io/skip1: "CKV_K8S_43=Image digest pinned in NEURON_NXDI_IMAGE via config/config.env"
    checkov.io/skip2: "CKV_K8S_14=Image tag pinned in NEURON_NXDI_IMAGE; static analysis cannot resolve envsubst"
    checkov.io/skip3: "CKV_K8S_15=imagePullPolicy IfNotPresent acceptable with pinned image"
    checkov.io/skip4: "CKV_K8S_40=runAsUser 1000 pending NxDI DLC UID compatibility test"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: oai-infopt-vllm-qwen3-5-4b-nxdi
  template:
    metadata:
      labels:
        app: oai-infopt-vllm-qwen3-5-4b-nxdi
        app.kubernetes.io/name: oai-infopt-vllm-qwen3-5-4b-nxdi
        app.kubernetes.io/component: inference-server
        project: observeai-inference-optimization
        engagement: shellkode-sow
        environment: sandbox
        model: qwen3-5-4b-nxdi
        source: neuron
    spec:
      serviceAccountName: oai-infopt-serving-sa
      automountServiceAccountToken: false
      hostPID: false
      hostIPC: false
      hostNetwork: false

      nodeSelector:
        eks.amazonaws.com/nodegroup: ${TRN2_NODEGROUP_NAME}

      tolerations:
        - key: aws.amazon.com/neuron
          operator: Exists
          effect: NoSchedule
        - key: CriticalAddonsOnly
          operator: Exists

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: benchmark-runner
                topologyKey: kubernetes.io/hostname

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      terminationGracePeriodSeconds: 180

      initContainers:
        # Assemble /app package layout from the flat code ConfigMaps.
        - name: code-assemble
          image: amazon/aws-cli:2.15.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              mkdir -p /app/src/nki_kernels
              cp /staging/code/* /app/
              cp /staging/src/* /app/src/
              cp /staging/nki/* /app/src/nki_kernels/
              echo "Assembled /app:"; find /app -name '*.py' | sort
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: "1"
              memory: "256Mi"
            limits:
              cpu: "2"
              memory: "512Mi"
          volumeMounts:
            - name: app
              mountPath: /app
            - name: stage-code
              mountPath: /staging/code
            - name: stage-src
              mountPath: /staging/src
            - name: stage-nki
              mountPath: /staging/nki
        # Sync weights + the compiled NxDI artifact from S3.
        - name: model-sync
          image: amazon/aws-cli:2.15.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              echo "Syncing weights s3://${MODEL_BUCKET}/${SOURCE_FOLDER}/ -> /model/"
              aws s3 sync "s3://${MODEL_BUCKET}/${SOURCE_FOLDER}/" /model/ \
                --region "${S3_BUCKET_REGION}" --no-progress
              test -f /model/config.json && echo "config.json OK" || { echo "ERROR: config.json missing"; exit 1; }
              echo "Syncing compiled artifact s3://${MODEL_BUCKET}/${COMPILED_FOLDER}/ -> /compiled/ (if present)"
              if aws s3 ls "s3://${MODEL_BUCKET}/${COMPILED_FOLDER}/" --region "${S3_BUCKET_REGION}" 2>/dev/null | grep -q .; then
                aws s3 sync "s3://${MODEL_BUCKET}/${COMPILED_FOLDER}/" /compiled/ \
                  --region "${S3_BUCKET_REGION}" --no-progress
                echo "Compiled artifact synced."
              else
                echo "No compiled artifact in S3 — server.py will compile on first boot (slow)."
              fi
          env:
            - name: AWS_DEFAULT_REGION
              value: "${AWS_REGION}"
            - name: S3_BUCKET_REGION
              value: "${S3_BUCKET_REGION}"
            - name: MODEL_BUCKET
              value: "${MODEL_BUCKET}"
            - name: SOURCE_FOLDER
              value: "${SOURCE_FOLDER}"
            - name: COMPILED_FOLDER
              value: "${COMPILED_FOLDER}"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: "4"
              memory: "8Gi"
            limits:
              cpu: "8"
              memory: "16Gi"
          volumeMounts:
            - name: model-weights
              mountPath: /model
            - name: compiled
              mountPath: /compiled

      containers:
        - name: nxdi-server
          image: ${NEURON_NXDI_IMAGE}
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command: ["/bin/bash", "-c"]
          args:
            - |
              echo "Qwen3.5 NxDI shim  model=/model  compiled=/compiled  cores/TP=${NEURON_CORES}"
              exec python3 server.py
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: HOME
              value: "/tmp"
            - name: USER
              value: "nxdi"
            - name: AWS_DEFAULT_REGION
              value: "${AWS_REGION}"
            - name: NEURONX_CACHE
              value: "/tmp/neuronx_cache"
            - name: NEURON_RT_NUM_CORES
              value: "${NEURON_CORES}"
            - name: NEURON_LOGICAL_NC_CONFIG
              value: "${QWEN35_LOGICAL_NC_CONFIG}"
            # Shim/server configuration (QWEN35_ prefix -> Pydantic Settings)
            - name: QWEN35_MODEL_PATH
              value: "/model"
            - name: QWEN35_COMPILED_PATH
              value: "/compiled"
            - name: QWEN35_SERVED_MODEL_NAME
              value: "${SERVED_NAME}"
            - name: QWEN35_TP_DEGREE
              value: "${QWEN35_TP_DEGREE}"
            - name: QWEN35_SEQ_LEN
              value: "${QWEN35_SEQ_LEN}"
            - name: QWEN35_MAX_BATCH_SIZE
              value: "${QWEN35_MAX_BATCH_SIZE}"
            - name: QWEN35_LOGICAL_NC_CONFIG
              value: "${QWEN35_LOGICAL_NC_CONFIG}"
            - name: QWEN35_TORCH_DTYPE
              value: "${QWEN35_TORCH_DTYPE}"
            - name: QWEN35_TOP_K_ON_DEVICE
              value: "${QWEN35_TOP_K_ON_DEVICE}"
            - name: QWEN35_PORT
              value: "8000"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: "16"
              memory: "64Gi"
              aws.amazon.com/neuron: "${NEURON_DEVICE_COUNT}"
            limits:
              cpu: "32"
              memory: "128Gi"
              aws.amazon.com/neuron: "${NEURON_DEVICE_COUNT}"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 600
            periodSeconds: 15
            failureThreshold: 480
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 720
            periodSeconds: 30
            failureThreshold: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: model-weights
              mountPath: /model
            - name: compiled
              mountPath: /compiled
            - name: app
              mountPath: /app
            - name: dshm
              mountPath: /dev/shm
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: model-weights
          emptyDir:
            sizeLimit: 60Gi
        - name: compiled
          emptyDir:
            sizeLimit: 60Gi
        - name: app
          emptyDir:
            sizeLimit: 16Mi
        - name: stage-code
          configMap:
            name: oai-infopt-nxdi-code-qwen3-5-4b-nxdi
            defaultMode: 0444
        - name: stage-src
          configMap:
            name: oai-infopt-nxdi-src-qwen3-5-4b-nxdi
            defaultMode: 0444
        - name: stage-nki
          configMap:
            name: oai-infopt-nxdi-nki-qwen3-5-4b-nxdi
            defaultMode: 0444
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
        - name: tmp
          emptyDir:
            sizeLimit: 100Gi

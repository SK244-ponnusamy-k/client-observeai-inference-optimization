# vllm/models/qwen3-5-4b-torchneuro/service.yaml
# ClusterIP for the TorchNeuron-native Qwen3.5-4B vLLM Neuron serving pod.
apiVersion: v1
kind: Service
metadata:
  name: oai-infopt-vllm-qwen3-5-4b-torchneuro
  namespace: oai-infopt
  labels:
    app.kubernetes.io/name: oai-infopt-vllm-qwen3-5-4b-torchneuro
    app.kubernetes.io/component: inference-server
    project: observeai-inference-optimization
    engagement: shellkode-sow
    environment: sandbox
    model: qwen3-5-4b-torchneuro
    source: neuron
spec:
  type: ClusterIP
  selector:
    app: oai-infopt-vllm-qwen3-5-4b-torchneuro
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP

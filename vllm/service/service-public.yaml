#   kubectl delete -f vllm/service/service-public.yaml
# ==============================================================================

apiVersion: v1
kind: Service
metadata:
  name: oai-infopt-vllm-qwen-3-5-4b
  namespace: oai-infopt
  labels:
    app.kubernetes.io/name: oai-infopt-vllm-qwen-3-5-4b
    app.kubernetes.io/component: inference-server
    project: observeai-inference-optimization
spec:
  type: LoadBalancer
  selector:
    app: oai-infopt-vllm-qwen-3-5-4b
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP

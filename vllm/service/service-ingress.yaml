# ==============================================================================
# vllm/service/service-ingress.yaml
#
# AWS Application Load Balancer (ALB) Ingress for vLLM inference service.
# Exposes HTTP on port 80 and routes to the model service inside the cluster.
#
# Apply:
#   kubectl apply -f vllm/service/service-ingress.yaml
#
# Check status / get ALB DNS address:
#   kubectl get ingress -n oai-infopt oai-infopt-vllm-alb-ingress
# ==============================================================================

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oai-infopt-vllm-alb-ingress
  namespace: oai-infopt
  labels:
    app.kubernetes.io/name: oai-infopt-vllm-alb-ingress
    app.kubernetes.io/component: ingress
    project: observeai-inference-optimization
    engagement: shellkode-sow
    environment: sandbox
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=300
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: oai-infopt-vllm-qwen-3-5-4b
                port:
                  number: 8000

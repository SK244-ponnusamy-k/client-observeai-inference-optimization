# ==============================================================================
# inference/benchmark-job.yaml
#
# In-cluster benchmark Job — profile-driven, runs on a SEPARATE CPU node
# from the GPU inference pod to avoid co-location latency contamination.
#
# All benchmark parameters come from the ConfigMap below — no inline edits.
# Update the ConfigMap values (MANIFEST_PATH, PROFILE_PATH, VLLM_ENDPOINT,
# RUN_ID) before applying.
#
# Security hardening (Checkov):
#   - Non-root user (UID 65534)                     [CKV_K8S_6,  CKV_K8S_40]
#   - readOnlyRootFilesystem: true                  [CKV_K8S_22]
#   - allowPrivilegeEscalation: false               [CKV_K8S_20]
#   - Capabilities: drop ALL                        [CKV_K8S_25, CKV_K8S_28]
#   - automountServiceAccountToken: false           [CKV_K8S_43]
#   - No hostPID/hostIPC/hostNetwork                [CKV_K8S_14-19]
#   - CPU + memory requests and limits set          [CKV_K8S_10, CKV_K8S_11]
#   - podAntiAffinity prevents co-location with GPU [latency isolation]
#
# Apply:
#   # 1. Edit the ConfigMap values below
#   # 2. Apply:
#   kubectl apply -f inference/benchmark-job.yaml -n oai-infopt
#   kubectl logs -n oai-infopt job/oai-infopt-benchmark -f
#   kubectl delete -f inference/benchmark-job.yaml -n oai-infopt
# ==============================================================================

---
# ConfigMap — all run parameters here; no hardcoded values in the Job spec
apiVersion: v1
kind: ConfigMap
metadata:
  name: oai-infopt-benchmark-config
  namespace: oai-infopt
  labels:
    app.kubernetes.io/name: oai-infopt-benchmark-config
    app.kubernetes.io/component: benchmark-config
    project: observeai-inference-optimization
    engagement: shellkode-sow
    environment: sandbox
data:
  # ── EDIT THESE before applying ───────────────────────────────────────────────
  VLLM_ENDPOINT: "http://oai-infopt-vllm-gpt-oss-20b:8000"   # ClusterIP svc name
  RUN_ID: "oai-infopt-2026-09-01-gpt-oss-20b-baseline-001"
  MANIFEST_PATH: "/configs/manifests/manifest.yaml"
  PROFILE_PATH: "/configs/profiles/profile.yaml"
  RESULTS_DIR: "/results"
  LOG_LEVEL: "INFO"
  WAIT_TIMEOUT: "300"
  AWS_DEFAULT_REGION: "us-east-2"
  RESULTS_BUCKET: "shellkode-ai-results"
  # ─────────────────────────────────────────────────────────────────────────────

---
apiVersion: batch/v1
kind: Job
metadata:
  name: oai-infopt-benchmark
  namespace: oai-infopt
  labels:
    app.kubernetes.io/name: oai-infopt-benchmark
    app.kubernetes.io/component: benchmark-runner
    app.kubernetes.io/managed-by: kubectl
    project: observeai-inference-optimization
    engagement: shellkode-sow
    environment: sandbox
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  activeDeadlineSeconds: 7200   # 2 h hard cap

  template:
    metadata:
      labels:
        app.kubernetes.io/name: oai-infopt-benchmark
        app.kubernetes.io/component: benchmark-runner
        project: observeai-inference-optimization
        engagement: shellkode-sow
        environment: sandbox
    spec:
      restartPolicy: Never
      serviceAccountName: oai-infopt-benchmark-sa
      automountServiceAccountToken: false

      hostPID: false
      hostIPC: false
      hostNetwork: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault

      # Benchmark runner MUST NOT co-locate on the GPU node
      # (would contaminate latency measurements)
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/component: inference-server
              topologyKey: kubernetes.io/hostname

      # Only schedule on CPU (non-GPU) nodes
      tolerations: []   # explicit: do not tolerate nvidia.com/gpu taint

      containers:
        - name: benchmark
          image: python:3.11-slim
          imagePullPolicy: IfNotPresent

          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail

              echo "Installing benchmark dependencies..."
              pip install --quiet --no-cache-dir \
                openai==1.35.14 \
                pyyaml==6.0.1 \
                aiohttp==3.9.5 \
                boto3==1.34.0

              echo "Starting benchmark..."
              python3 /app/load-test.py \
                --manifest "${MANIFEST_PATH}" \
                --profile  "${PROFILE_PATH}" \
                --endpoint "${VLLM_ENDPOINT}" \
                --output   "${RESULTS_DIR}" \
                --wait-timeout "${WAIT_TIMEOUT}"

              echo "Benchmark complete."
              ls -lh "${RESULTS_DIR}/"

              echo "Uploading results to S3..."
              python3 -c "
              import boto3, os, glob
              bucket = os.environ.get('RESULTS_BUCKET', '')
              region = os.environ.get('AWS_DEFAULT_REGION', 'us-east-2')
              if not bucket:
                  print('RESULTS_BUCKET not set — skipping S3 upload')
              else:
                  s3 = boto3.client('s3', region_name=region)
                  run_id = os.environ.get('RUN_ID', 'unknown')
                  for f in glob.glob('/results/*.jsonl'):
                      key = f'results/{run_id}/' + os.path.basename(f)
                      s3.upload_file(f, bucket, key)
                      print(f'Uploaded: s3://{bucket}/{key}')
              " 2>/dev/null || echo "S3 upload skipped"

          envFrom:
            - configMapRef:
                name: oai-infopt-benchmark-config

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault

          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"

          volumeMounts:
            - name: app-code
              mountPath: /app
              readOnly: true
            - name: manifest-volume
              mountPath: /configs/manifests
              readOnly: true
            - name: profile-volume
              mountPath: /configs/profiles
              readOnly: true
            - name: results
              mountPath: /results
            - name: tmp
              mountPath: /tmp

      volumes:
        # load-test.py script (mounted from a ConfigMap or init container)
        - name: app-code
          configMap:
            name: oai-infopt-benchmark-script
            optional: true   # falls back to image-bundled script if not present
        # Manifest + profile ConfigMaps (created alongside this Job)
        - name: manifest-volume
          configMap:
            name: oai-infopt-benchmark-manifest
            optional: true
        - name: profile-volume
          configMap:
            name: oai-infopt-benchmark-profile
            optional: true
        # Results written here; upload to S3 after job completes
        - name: results
          emptyDir:
            sizeLimit: 1Gi
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi

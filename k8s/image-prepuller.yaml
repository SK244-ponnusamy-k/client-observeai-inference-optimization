# ==============================================================================
# k8s/image-prepuller.yaml
#
# Optional DaemonSet to pre-pull the heavy vLLM Deep Learning Container (DLC)
# image across nodes in the background so pod startup is instant.
#
# Apply:
#   kubectl apply -f k8s/image-prepuller.yaml
# ==============================================================================

apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: oai-infopt-vllm-prepuller
  namespace: oai-infopt
  labels:
    app.kubernetes.io/name: vllm-prepuller
    app.kubernetes.io/component: image-prepuller
    project: observeai-inference-optimization
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm-prepuller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm-prepuller
    spec:
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: prepuller
          image: public.ecr.aws/deep-learning-containers/vllm:0.26.0-gpu-py312-cu130-ubuntu22.04-ec2-v1.0-soci@sha256:e70d649d964dd0b568669453df523e764d23933987ea378d0f423cbe4ae56b81
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "echo Pre-pulled image successfully; sleep infinity"]
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"

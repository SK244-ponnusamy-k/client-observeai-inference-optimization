# ==============================================================================
# k8s/download/hf-token-external-secret.yaml
#
# Pulls the HuggingFace token from AWS Secrets Manager into the cluster
# using the External Secrets Operator (ESO).
#
# WHY: kubectl create secret --from-literal stores the token as a plain base64
# string in etcd. Anyone with GET/LIST on Secrets in the namespace can read it.
# ESO + Secrets Manager gives:
#   - Rotation without pod restarts (ESO re-syncs on a schedule)
#   - Audit trail via CloudTrail
#   - Single source of truth — the value never lives in git or shell history
#   - Access scoped to the download SA's IAM role only
#
# PREREQUISITES:
#   1. External Secrets Operator installed:
#        helm repo add external-secrets https://charts.external-secrets.io
#        helm install external-secrets external-secrets/external-secrets \
#          --namespace external-secrets --create-namespace
#
#   2. Secret already created in Secrets Manager (done by bootstrap.sh prompt):
#        aws secretsmanager create-secret \
#          --name 'oai-infopt/hf-token' \
#          --secret-string '{"token":"hf_YOUR_TOKEN_HERE"}' \
#          --region us-east-2
#
#   3. Download IAM role (oai-infopt-download-role) has
#      secretsmanager:GetSecretValue scoped to that secret ARN — done by
#      cluster/setup-pod-identity.sh.
#
# Apply:
#   kubectl apply -f k8s/download/hf-token-external-secret.yaml
# ==============================================================================

---
# ClusterSecretStore — uses EKS Pod Identity / IRSA for auth (no static keys)
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: oai-infopt-aws-secretsmanager
  namespace: oai-infopt
  labels:
    app.kubernetes.io/name: oai-infopt-aws-secretsmanager
    app.kubernetes.io/component: secret-store
    app.kubernetes.io/managed-by: kubectl
    project: observeai-inference-optimization
    engagement: shellkode-sow
    environment: sandbox
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-2          # overridden at deploy time if needed
      auth:
        # Uses the pod's IAM identity (Pod Identity / IRSA) — no static credentials
        jwt:
          serviceAccountRef:
            name: oai-infopt-download-sa

---
# ExternalSecret — syncs oai-infopt/hf-token → k8s Secret hf-token
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: hf-token
  namespace: oai-infopt
  labels:
    app.kubernetes.io/name: hf-token
    app.kubernetes.io/component: external-secret
    app.kubernetes.io/managed-by: external-secrets-operator
    project: observeai-inference-optimization
    engagement: shellkode-sow
    environment: sandbox
spec:
  # Re-sync every hour — picks up token rotation automatically
  refreshInterval: 1h

  secretStoreRef:
    name: oai-infopt-aws-secretsmanager
    kind: SecretStore

  target:
    name: hf-token           # name of the resulting k8s Secret
    creationPolicy: Owner     # ESO owns the secret lifecycle
    deletionPolicy: Retain    # keep the secret if ESO is removed (safety)
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: hf-token
          app.kubernetes.io/component: credentials
          project: observeai-inference-optimization
          environment: sandbox

  data:
    - secretKey: token        # key inside the resulting k8s Secret
      remoteRef:
        key: oai-infopt/hf-token   # Secrets Manager secret name
        property: token            # JSON field inside the secret value

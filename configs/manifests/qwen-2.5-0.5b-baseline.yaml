# ==============================================================================
# configs/manifests/qwen-2.5-0.5b-baseline.yaml
#
# Benchmark run manifest — Qwen2.5-0.5B baseline (no quantization)
# SMOKE TEST model: validates the onboard->deploy->benchmark->teardown path
# end to end on the cheapest GPU before spending on the larger models.
# Per oai-infopt-standards.md: every field here drives the benchmark.
#
# 2026-09-10 — Added served_name + tokenizer; fixed s3_prefix; bumped max_model_len
#   4096 -> 8192 to match the updated deployment (CHANGELOG.md).
# ==============================================================================

run_id: oai-infopt-2026-09-10-qwen-0.5b-baseline-001
description: "Qwen2.5-0.5B-Instruct smoke test — no quantization, g6e.xlarge"

model:
  hf_id: Qwen/Qwen2.5-0.5B-Instruct
  served_name: Qwen2.5-0.5B-Instruct        # matches --served-model-name
  tokenizer: Qwen/Qwen2.5-0.5B-Instruct
  s3_prefix: Qwen2.5-0.5B-Instruct/         # relative to MODEL_BUCKET
  source: eks_gpu

serving:
  image: public.ecr.aws/deep-learning-containers/vllm:0.26.0-gpu-py312-cu130-ubuntu22.04-ec2-v1.0-soci@sha256:e70d649d964dd0b568669453df523e764d23933987ea378d0f423cbe4ae56b81
  nodepool: gpu-inf
  instance_type: g6e.xlarge

optimization_variants:
  - label: baseline
    quantization: none
    tensor_parallel_size: 1
    max_num_seqs: 64
    max_num_batched_tokens: 8192
    max_model_len: 8192
    kv_cache_dtype: auto

benchmark:
  workload_profiles:
    - configs/workload_profiles/realtime_v1.yaml
    - configs/workload_profiles/batch_v1.yaml

cost:
  instance_hourly_usd: 1.08   # g6e.xlarge on-demand us-east-2 — verify before run

tags:
  Project: observeai-inference-optimization
  Engagement: shellkode-sow
  Environment: sandbox
  ManagedBy: benchmark-runner
  Owner: TBD
  CostCenter: TBD
  RunId: oai-infopt-2026-09-10-qwen-0.5b-baseline-001

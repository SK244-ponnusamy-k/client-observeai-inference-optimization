    quantization: mxfp4
    tensor_parallel_size: 1
    max_num_seqs: 256
    max_num_batched_tokens: 8192
    max_model_len: 16384
    kv_cache_dtype: auto

benchmark:
  workload_profiles:
    - configs/workload_profiles/realtime_v1.yaml
    - configs/workload_profiles/batch_v1.yaml

cost:
  instance_hourly_usd: 4.32    # g7e.2xlarge on-demand us-east-2 (Ohio) — verified 2026-09-10


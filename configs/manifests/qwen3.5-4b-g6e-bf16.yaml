run_id: oai-infopt-2026-08-20-qwen3.5-4b-g6e-bf16-001
description: "Qwen/Qwen3.5-4B bf16, g6e.2xlarge (1x L40S), single GPU, text path"

model:
  hf_id: Qwen/Qwen3.5-4B
  served_name: Qwen3.5-4B
  tokenizer: Qwen/Qwen3.5-4B
  s3_prefix: Qwen3.5-4B/
  source: eks_gpu

serving:
  image: public.ecr.aws/deep-learning-containers/vllm:0.26.0-gpu-py312-cu130-ubuntu22.04-ec2-v1.0-soci@sha256:e70d649d964dd0b568669453df523e764d23933987ea378d0f423cbe4ae56b81

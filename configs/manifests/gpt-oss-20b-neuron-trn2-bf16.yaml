run_id: gpt-oss-20b-neuron-2026-10-12-001
description: "openai/gpt-oss-20b bf16, trn2.3xlarge"

model:
  hf_id: openai/gpt-oss-20b
  served_name: gpt-oss-20b
  tokenizer: openai/gpt-oss-20b
  s3_prefix: gpt-oss-20b/
  source: neuron

serving:
  image: public.ecr.aws/neuron/pytorch-inference-vllm-neuronx:0.21.0.1.0.0-neuronx-py313-sdk2.31.0-ubuntu24.04
  nodepool: neuron-inf
  instance_type: trn2.3xlarge

optimization_variants:
  - label: bf16-trn2
    quantization: bf16
    tensor_parallel_size: 4       # TP=4 (LNC=2 -> 4 logical cores); must equal compile-time --num_cores
    max_num_seqs: 32              # top num_seqs bucket (recompile pass 1; pass 2 = 64)
    max_num_batched_tokens: 4096  # < max_model_len so segmented prefill (required by APC) is enabled
    max_model_len: 8192           # sized to real transcripts
    kv_cache_dtype: auto

benchmark:
  workload_profiles:
    - configs/workload_profiles/realtime_v1.yaml
    - configs/workload_profiles/batch_v1.yaml

cost:
  instance_hourly_usd: 2.235    # trn2.3xlarge Capacity Block rate — VERIFY before run (labelled "Capacity Block" in cost report)

tags:

# ==============================================================================
# configs/manifests/gemma-4-31b-baseline.yaml
#
# Benchmark run manifest — google/gemma-4-31B-it baseline (no quantization)
# Per oai-infopt-standards.md: every field here drives the benchmark;
# nothing is hardcoded in framework code.
#
# History: the BASE checkpoint (google/gemma-4-31B) was tried first and
# confirmed at request time to have no chat_template, so every
# /v1/chat/completions call (used by inference/load-test.py) failed with a
# 400. Switched to -it, which ships a working chat template.
# ==============================================================================

run_id: oai-infopt-2026-09-08-gemma-4-31b-it-baseline-001
description: "google/gemma-4-31B-it baseline (instruction-tuned) — bf16, TP=4, g6e.12xlarge"

model:
  hf_id: google/gemma-4-31B-it
  served_name: gemma-4-31b          # must match --served-model-name in deployment.yaml
  s3_prefix: gemma-4-31B-it/        # relative to MODEL_BUCKET
  source: eks_gpu

serving:
  # Image digest pinned 2026-09-03 — linux/amd64, see config/config.env for re-pin one-liner.
  image: public.ecr.aws/deep-learning-containers/vllm:0.26.0-gpu-py312-cu130-ubuntu22.04-ec2-v1.0-soci@sha256:e70d649d964dd0b568669453df523e764d23933987ea378d0f423cbe4ae56b81
  nodepool: gpu-inf
  instance_type: g6e.12xlarge      # 4x L40S 48GB (192GB total); TP=4 required — dense 31B bf16 weights ~63GB

optimization_variants:
  - label: baseline
    quantization: none
    tensor_parallel_size: 4
    max_num_seqs: 128
    # Gemma4's vision encoder forces vLLM to disable chunked MM input, which
    # requires max_num_batched_tokens >= the model's per-image token budget
    # (2496) — 2048 (fine for text-only models) causes a startup ValueError.
    max_num_batched_tokens: 4096
    max_model_len: 8192
    # kv_cache_dtype not set — defaults to auto (fp16/bf16 depending on model dtype).

benchmark:
  workload_profiles:
    - configs/workload_profiles/realtime_v1.yaml
    - configs/workload_profiles/batch_v1.yaml

cost:
  instance_hourly_usd: 10.49   # g6e.12xlarge on-demand us-east-2 — verify before run

tags:
  Project: observeai-inference-optimization
  Engagement: shellkode-sow
  Environment: sandbox
  ManagedBy: benchmark-runner
  Owner: TBD
  CostCenter: TBD
  RunId: oai-infopt-2026-09-08-gemma-4-31b-it-baseline-001

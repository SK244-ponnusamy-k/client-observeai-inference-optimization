run_id: oai-infopt-2026-08-20-gpt-oss-20b-g6-mxfp4-001
description: "openai/gpt-oss-20b MXFP4, g6.2xlarge (1x L4 24GB), single GPU"

model:
  hf_id: openai/gpt-oss-20b
  served_name: gpt-oss-20b
  tokenizer: openai/gpt-oss-20b
  s3_prefix: gpt-oss-20b/
  source: eks_gpu

serving:
  image: public.ecr.aws/deep-learning-containers/vllm:0.26.0-gpu-py312-cu130-ubuntu22.04-ec2-v1.0-soci@sha256:e70d649d964dd0b568669453df523e764d23933987ea378d0f423cbe4ae56b81
  nodepool: gpu-inf
  instance_type: g6.2xlarge

optimization_variants:
  - label: mxfp4-g6
    quantization: mxfp4
    tensor_parallel_size: 1
    max_num_seqs: 256
    max_num_batched_tokens: 8192
    max_model_len: 16384
    kv_cache_dtype: auto

benchmark:
  workload_profiles:
    - configs/workload_profiles/realtime_v1.yaml
    - configs/workload_profiles/batch_v1.yaml

cost:
  instance_hourly_usd: 0.98    # g6.2xlarge on-demand us-east-2 — VERIFY before run

tags:
  Project: observeai-inference-optimization
  Engagement: shellkode-sow
  Environment: sandbox
  ManagedBy: benchmark-runner
  Owner: TBD
  CostCenter: TBD
  RunId: oai-infopt-2026-08-20-gpt-oss-20b-g6-mxfp4-001

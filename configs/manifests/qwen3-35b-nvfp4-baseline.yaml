# ==============================================================================
# configs/manifests/qwen3-35b-nvfp4-baseline.yaml
#
# Benchmark run manifest — nvidia/Qwen3.6-35B-A3B-NVFP4 baseline
# Per oai-infopt-standards.md: every field here drives the benchmark;
# nothing is hardcoded in framework code.
# ==============================================================================

run_id: oai-infopt-2026-09-07-qwen3-35b-nvfp4-baseline-001
description: "nvidia/Qwen3.6-35B-A3B-NVFP4 NVFP4 baseline, g6e.12xlarge, TP=2"

model:
  hf_id: nvidia/Qwen3.6-35B-A3B-NVFP4
  served_name: qwen3-35b-nvfp4          # must match --served-model-name in deployment.yaml
  s3_prefix: Qwen3.6-35B-A3B-NVFP4/   # relative to MODEL_BUCKET
  source: eks_gpu

serving:
  # Image digest pinned 2026-09-03 — linux/amd64, see config/config.env for re-pin one-liner.
  image: public.ecr.aws/deep-learning-containers/vllm:0.26.0-gpu-py312-cu130-ubuntu22.04-ec2-v1.0-soci@sha256:e70d649d964dd0b568669453df523e764d23933987ea378d0f423cbe4ae56b81
  nodepool: gpu-inf
  instance_type: g6e.2xlarge          # 1× L40S 48 GB; single GPU

optimization_variants:
  - label: nvfp4-baseline
    quantization: nvfp4
    tensor_parallel_size: 1
    max_num_seqs: 128
    max_num_batched_tokens: 2048
    max_model_len: 8192
    # kv_cache_dtype not set — defaults to auto (fp16/bf16 depending on model dtype).
    # NVFP4 models may support fp8 KV cache; validate with vLLM 0.8.5+ before enabling.

benchmark:
  workload_profiles:
    - configs/workload_profiles/realtime_v1.yaml
    - configs/workload_profiles/batch_v1.yaml

cost:
  instance_hourly_usd: 2.17   # g6e.2xlarge on-demand us-east-2 — verify before run

tags:
  Project: observeai-inference-optimization
  Engagement: shellkode-sow
  Environment: sandbox
  ManagedBy: benchmark-runner
  Owner: TBD
  CostCenter: TBD
  RunId: oai-infopt-2026-09-07-qwen3-35b-nvfp4-baseline-001

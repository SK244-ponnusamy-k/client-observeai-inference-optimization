# ==============================================================================
# configs/manifests/gpt-oss-20b-baseline.yaml
#
# Benchmark run manifest — gpt-oss-20b baseline (MXFP4 quantization)
# Per oai-infopt-standards.md: every field here drives the benchmark;
# nothing is hardcoded in framework code.
# ==============================================================================

run_id: oai-infopt-2026-09-01-gpt-oss-20b-baseline-001
description: "openai/gpt-oss-20b MXFP4 baseline, g6e.2xlarge"

model:
  hf_id: openai/gpt-oss-20b
  s3_prefix: models/gpt-oss-20b/   # relative to MODEL_BUCKET
  source: eks_gpu

serving:
  # Image digest pinned 2026-09-03 — linux/amd64, see config/config.env for re-pin one-liner.
  image: public.ecr.aws/deep-learning-containers/vllm:0.26.0-gpu-py312-cu130-ubuntu22.04-ec2-v1.0-soci@sha256:e70d649d964dd0b568669453df523e764d23933987ea378d0f423cbe4ae56b81
  nodepool: gpu-inf
  instance_type: g6e.2xlarge

optimization_variants:
  - label: mxfp4-baseline
    quantization: mxfp4
    tensor_parallel_size: 1
    max_num_seqs: 128
    max_num_batched_tokens: 8192
    max_model_len: 8192          # corrected: deployment.yaml had 4096, manifest had 8192 — aligned to 8192
    kv_cache_dtype: fp8

benchmark:
  workload_profiles:
    - configs/workload_profiles/realtime_v1.yaml
    - configs/workload_profiles/batch_v1.yaml

cost:
  instance_hourly_usd: 2.17   # g6e.2xlarge on-demand us-east-2 — verify before run

tags:
  Project: observeai-inference-optimization
  Engagement: shellkode-sow
  Environment: sandbox
  ManagedBy: benchmark-runner
  Owner: TBD
  CostCenter: TBD
  RunId: oai-infopt-2026-09-01-gpt-oss-20b-baseline-001

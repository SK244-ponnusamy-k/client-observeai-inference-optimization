apiVersion: batch/v1
kind: Job
metadata:
  name: oai-infopt-bench-qwen-0-5b-realtime-manual
  namespace: oai-infopt
  labels:
    app.kubernetes.io/component: benchmark-runner
    project: observeai-inference-optimization
    model: "qwen-0.5b"
    profile: "realtime"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 7200
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/component: benchmark-runner
        project: observeai-inference-optimization
    spec:
      restartPolicy: Never
      serviceAccountName: oai-infopt-benchmark-sa
      automountServiceAccountToken: false
      hostPID: false
      hostIPC: false
      hostNetwork: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: benchmark
          image: python:3.11-slim
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              export HOME=/tmp
              pip install --quiet --no-cache-dir --target=/tmp/pip-packages \
                "openai==1.57.0" \
                pyyaml==6.0.1 \
                boto3==1.34.0 \
                "aiohttp==3.10.0"
              export PYTHONPATH=/tmp/pip-packages
              TEST_EXIT=0
              python3 /app/load-test.py \
                --manifest /configs/manifests/manifest.yaml \
                --profile  /configs/profiles/profile.yaml \
                --endpoint "http://oai-infopt-vllm-qwen-0-5b:8000" \
                --output   /results \
                --wait-timeout 300 || TEST_EXIT=$?
              echo "=== Uploading results to S3 ==="
              python3 -c "
              import boto3, os, glob
              s3 = boto3.client('s3', region_name='us-east-2')
              for f in glob.glob('/results/*.jsonl'):
                  key = 'results/manual/realtime/' + os.path.basename(f)
                  s3.upload_file(f, 'shellkode-ai-results', key)
                  print('Uploaded: s3://shellkode-ai-results/' + key)
              " || true
              if [ $TEST_EXIT -ne 0 ]; then
                echo "[WARN] Load test completed with non-zero status $TEST_EXIT (SLO warning)"
              fi
              exit 0
          env:
            - name: AWS_DEFAULT_REGION
              value: "us-east-2"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          volumeMounts:
            - name: app-code
              mountPath: /app
              readOnly: true
            - name: manifest
              mountPath: /configs/manifests
              readOnly: true
            - name: profile
              mountPath: /configs/profiles
              readOnly: true
            - name: results
              mountPath: /results
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: app-code
          configMap:
            name: oai-infopt-benchmark-script
        - name: manifest
          configMap:
            name: oai-infopt-benchmark-manifest
        - name: profile
          configMap:
            name: oai-infopt-benchmark-profile-realtime
        - name: results
          emptyDir:
            sizeLimit: 1Gi
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi

# ==============================================================================
# configs/manifests/gemma-4-31b-g7e-none.yaml
#
# Benchmark run manifest for google/gemma-4-31B-it (none) on a 4-GPU g7e node.
# gemma-4-31b is a DENSE 31B (~63 GB bf16) — it does NOT fit one GPU. It needs
# 4 GPUs (TP=4). Deploy it on any 4-GPU g7e size (g7e.12xlarge or g7e.24xlarge)
# via `--hw`; the actual instance + its cost are resolved DYNAMICALLY at run time
# (OAI_INSTANCE_TYPE from --hw → EC2 price book in load-test.py), so this one
# manifest works for every 4-GPU g7e size without editing.
# Every field is read by inference/load-test.py.
# ==============================================================================
run_id: gemma-4-31b-g7e-2026-09-18-001
description: "google/gemma-4-31B-it none, g7e (4x GPU, TP=4)"

model:
  hf_id: google/gemma-4-31B-it
  served_name: gemma-4-31b
  tokenizer: google/gemma-4-31B-it
  s3_prefix: gemma-4-31B-it/
  source: eks_gpu

serving:
  image: public.ecr.aws/deep-learning-containers/vllm:0.26.0-gpu-py312-cu130-ubuntu22.04-ec2-v1.0-soci@sha256:e70d649d964dd0b568669453df523e764d23933987ea378d0f423cbe4ae56b81
  nodepool: gpu-g7-inf
  # Default cell instance (a 4-GPU g7e). The REAL instance comes from --hw at
  # deploy time and is recorded via OAI_INSTANCE_TYPE — this is only the fallback
  # label when no --hw instance is provided.
  instance_type: g7e.12xlarge

optimization_variants:
  - label: none-g7e
    quantization: none
    tensor_parallel_size: 4
    max_num_seqs: 128
    max_num_batched_tokens: 4096
    max_model_len: 8192
    kv_cache_dtype: auto

benchmark:
  workload_profiles:
    - configs/workload_profiles/realtime_v1.yaml
    - configs/workload_profiles/batch_v1.yaml

# NOTE: no cost.instance_hourly_usd here on purpose. Cost is resolved DYNAMICALLY
# from the deployed instance type (OAI_INSTANCE_TYPE / serving.instance_type)
# against the EC2 price book in load-test.py. Add an explicit value ONLY to
# override the price book for a special term (spot, savings plan, etc.).

tags:
  Project: observeai-inference-optimization
  Engagement: shellkode-sow
  Environment: sandbox
  ManagedBy: oai-cli
  Owner: TBD
  CostCenter: TBD
  RunId: gemma-4-31b-g7e-2026-09-18-001

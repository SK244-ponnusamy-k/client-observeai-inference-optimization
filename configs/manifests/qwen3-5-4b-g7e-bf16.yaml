# ==============================================================================
# configs/manifests/qwen3-5-4b-g7e-bf16.yaml  - one-off cell (NOT generated)
#
# Benchmark run manifest for Qwen/Qwen3.5-4B (bf16) on g7e.2xlarge.
# Created manually for a one-off g7e run (the catalog candidates only cover
# g5/g6/g6e, so `oai model generate` does not emit this cell). qwen3.5-4b is a
# dense 4B, TP=1, hardware-agnostic serving config — identical to the g6e cell
# except instance_type / nodepool / cost. Every field is read by
# inference/load-test.py.
# ==============================================================================
run_id: qwen3-5-4b-g7e-2026-09-18-001
description: "Qwen/Qwen3.5-4B bf16, g7e.2xlarge"

model:
  hf_id: Qwen/Qwen3.5-4B
  served_name: Qwen3.5-4B
  tokenizer: Qwen/Qwen3.5-4B
  s3_prefix: Qwen3.5-4B/
  source: eks_gpu

serving:
  image: public.ecr.aws/deep-learning-containers/vllm:0.26.0-gpu-py312-cu130-ubuntu22.04-ec2-v1.0-soci@sha256:e70d649d964dd0b568669453df523e764d23933987ea378d0f423cbe4ae56b81
  nodepool: gpu-g7-inf
  instance_type: g7e.2xlarge

optimization_variants:
  - label: bf16-g7e
    quantization: bf16
    tensor_parallel_size: 1
    max_num_seqs: 256
    max_num_batched_tokens: 8192
    max_model_len: 8192
    kv_cache_dtype: auto

benchmark:
  workload_profiles:
    - configs/workload_profiles/realtime_v1.yaml
    - configs/workload_profiles/batch_v1.yaml

# cost.instance_hourly_usd is resolved DYNAMICALLY at run time from the deployed
# instance (OAI_INSTANCE_TYPE / serving.instance_type) against the EC2 price book
# in load-test.py. Set an explicit value here ONLY to override for a special term
# (spot, savings plan, etc.).

tags:
  Project: observeai-inference-optimization
  Engagement: shellkode-sow
  Environment: sandbox
  ManagedBy: manual
  Owner: TBD
  CostCenter: TBD
  RunId: qwen3-5-4b-g7e-2026-09-18-001

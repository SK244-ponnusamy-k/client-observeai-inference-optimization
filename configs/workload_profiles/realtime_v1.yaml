# ==============================================================================
# configs/workload_profiles/realtime_v1.yaml
#
# Frozen workload profile — REALTIME
# Profile version: v1  |  Status: FROZEN (semantics fixed; do not change token
#                                          lengths / concurrency / SLO — make a v2)
#
# Purpose: Latency-bound benchmark simulating interactive QA / real-time
#          inference on conversation transcripts. Low concurrency, tight TTFT SLO.
#
# 2026-09-10 — SCHEMA ALIGNED to the `vllm bench serve` orchestrator (see
#   CHANGELOG.md). The keys the harness actually reads are marked [ACTIVE].
#   The workload SEMANTICS are unchanged (same input length, output length,
#   concurrency, and SLO thresholds as the original v1).
#
# Per ml-pipeline-standards.md: freeze this profile BEFORE benchmarking.
# Metrics are only comparable across models when the profile is fixed.
# ==============================================================================

profile_id: realtime_v1          # [ACTIVE]
profile_type: realtime
description: >
  Low-concurrency latency-bound profile for real-time QA form completion.
  Simulates a single agent processing one conversation at a time.
  Measures TTFT, inter-token latency (ITL), P50/P95/P99.

# -- Input distribution -------------------------------------------------------
# The harness drives `vllm bench serve`. We use the built-in `random` dataset for
# deterministic, PII-free, reproducible inputs (seed-fixed). random_input_len is
# set to the transcript p95 so latency reflects realistic prompt sizes; the
# range-ratio (bench_extra_args) spreads lengths to approximate the p50/p95 mix.
# To run against a curated dataset instead, set input.dataset_name to a bench
# dataset (e.g. sharegpt) and pass its path via bench_extra_args.
input:
  dataset_name: random           # [ACTIVE] built-in synthetic dataset (no PII)
  random_input_len: 1024         # [ACTIVE] ~transcript p95 in tokens
  ignore_eos: true               # [ACTIVE] hold output length fixed for clean ITL
  # --- descriptive (documentation only; not read by the harness) -------------
  token_distribution:
    p50_tokens: 512
    p95_tokens: 1024
    max_tokens: 2048
  guided_decoding: true
  output_schema: configs/workload_profiles/schemas/qa_form_v1.json

# -- Output target ------------------------------------------------------------
output:
  max_new_tokens: 512            # [ACTIVE] mapped to --random-output-len
  seed: 42                       # [ACTIVE] deterministic
  reasoning_effort: medium       # [ACTIVE] recorded per result row (reasoning models)
  temperature: 0.0               # (documentation) bench serve uses greedy by default

# -- Concurrency + sample sizing ----------------------------------------------
concurrency_levels: [1, 2, 4]    # [ACTIVE]
# num_prompts per level = max(concurrency * num_prompts_factor, min_prompts)
num_prompts_factor: 25           # [ACTIVE]
min_prompts: 100                 # [ACTIVE] ~100 steady-state samples/level
# NOTE: `vllm bench serve` has no warmup-discard flag; num_prompts >> concurrency
# so steady state dominates. For strict warmup exclusion run a throwaway level first.
warmup_requests: 10              # (documentation)
duration_s: 300                  # (documentation) wall-clock guidance

# -- Latency SLO (pass/fail threshold) ----------------------------------------
# Keys read by the harness: ttft_p95_ms, itl_p95_ms.
slo:
  ttft_p95_ms: 500               # [ACTIVE] 500 ms TTFT p95 target
  itl_p95_ms: 50                 # [ACTIVE] 50 ms inter-token latency p95
  error_rate_pct: 1.0            # (documentation)
  # accuracy is NOT measured by the perf harness — see the separate lm-eval stage.

# -- Extra passthrough flags to `vllm bench serve` ----------------------------
bench_extra_args:                # [ACTIVE]
  - "--random-range-ratio"
  - "0.5"                        # spread input/output lengths ±50% around the mean

# -- Runner (documentation) ---------------------------------------------------
runner: vllm_bench_serve
endpoint_path: /v1/chat/completions

# ==============================================================================
# cluster/neuron-nodepool.yaml
#
# Karpenter NodePool for AWS Trainium (Neuron) inference — Flow B.
# Separate from gpu-inf (which is GPU category "g" only).
#
# Trainium nodes are tainted with aws.amazon.com/neuron so only Neuron-tolerating
# pods (the vLLM-Neuron serving Deployment) schedule here. On-demand only.
#
# Apply:
#   kubectl apply -f cluster/neuron-nodepool.yaml
# ==============================================================================

apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: neuron-inf
  labels:
    app.kubernetes.io/name: neuron-inf
    app.kubernetes.io/component: nodepool
    app.kubernetes.io/managed-by: karpenter
    project: observeai-inference-optimization
    environment: sandbox
    engagement: shellkode-sow
spec:
  template:
    metadata:
      labels:
        workload: neuron
        workload-type: ai-ml
        project: observeai-inference-optimization
        environment: sandbox
        engagement: shellkode-sow
    spec:
      nodeClassRef:
        group: eks.amazonaws.com
        kind: NodeClass
        name: default

      # Only Neuron-tolerating pods schedule here
      taints:
        - key: aws.amazon.com/neuron
          effect: NoSchedule

      requirements:
        # Use instance-family directly without instance-category.
        # The instance-category + instance-family combination caused UnfulfillableCapacity
        # in EKS Auto Mode's Fleet API — using family alone avoids that conflict.
        - key: eks.amazonaws.com/instance-family
          operator: In
          values: ["trn2"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]

  # Safety cap — Trainium nodes are expensive; keep the ceiling tight for benchmarking.
  limits:
    cpu: "256"

  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 10m

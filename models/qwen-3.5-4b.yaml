# ==============================================================================
# models/qwen-3.5-4b.yaml
#
# Single source of truth for the Qwen/Qwen3.5-4B model.
# Used by: scripts/download.sh  scripts/deploy.sh  scripts/stop.sh
#          inference/run-benchmark.sh
#
# To onboard this model:
#   bash scripts/download.sh --model qwen-3.5-4b
#   bash scripts/deploy.sh   --model qwen-3.5-4b
#   bash inference/run-benchmark.sh --model qwen-3.5-4b --profile realtime
#   bash scripts/stop.sh     --model qwen-3.5-4b
# ==============================================================================

# ── Identity ──────────────────────────────────────────────────────────────────
# slug used in all k8s names (no dots)
model_id: qwen-3-5-4b
# friendly name for --model argument
model_alias: qwen-3.5-4b
# HuggingFace repo
hf_id: Qwen/Qwen3.5-4B
# folder inside MODEL_BUCKET
s3_folder: Qwen3.5-4B
# --served-model-name passed to vLLM
served_name: Qwen3.5-4B
# local port for kubectl port-forward
port_forward_port: "8083"
benchmark_manifest: configs/manifests/qwen-3.5-4b-baseline.yaml

# ── Download ──────────────────────────────────────────────────────────────────
download:
  size_gb: 8
  # emptyDir for staging before S3 upload
  tmp_size_gi: 30
  # public model, no HF token required
  gated: false

# ── Serving ───────────────────────────────────────────────────────────────────
serving:
  gpu_memory_utilization: "0.80"
  max_model_len: "8192"
  max_num_seqs: "256"
  max_num_batched_tokens: "2048"
  # empty string = no --quantization flag (unquantized)
  quantization: ""
  load_format: "runai_streamer"
  extra_args:
    - "--trust-remote-code"
    - "--enable-chunked-prefill"
    - "--enable-prefix-caching"

# ── Kubernetes resources ───────────────────────────────────────────────────────
resources:
  cpu_request: "4"
  cpu_limit: "8"
  memory_request: "24Gi"
  memory_limit: "30Gi"
  gpu: "1"
  pvc_storage: "5Gi"
  tmp_size: "2Gi"
  dshm_size: "16Gi"

# ── Probes ────────────────────────────────────────────────────────────────────
probes:
  readiness_initial_delay_s: 300
  liveness_initial_delay_s: 360
  termination_grace_period_s: 120

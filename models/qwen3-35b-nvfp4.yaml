# ==============================================================================
# models/qwen3-35b-nvfp4.yaml
#
# Single source of truth for the nvidia/Qwen3.6-35B-A3B-NVFP4 model.
# Used by: scripts/download.sh  scripts/deploy.sh  scripts/stop.sh
#          inference/run-benchmark.sh
#
# To onboard this model:
#   bash scripts/download.sh --model qwen3-35b-nvfp4
#   bash scripts/deploy.sh   --model qwen3-35b-nvfp4
#   bash inference/run-benchmark.sh --model qwen3-35b-nvfp4 --profile realtime
#   bash scripts/stop.sh     --model qwen3-35b-nvfp4
# ==============================================================================

# ── Identity ──────────────────────────────────────────────────────────────────
model_id: qwen3-35b-nvfp4                     # slug used in all k8s names
hf_id: nvidia/Qwen3.6-35B-A3B-NVFP4          # HuggingFace repo
s3_folder: Qwen3.6-35B-A3B-NVFP4             # folder inside MODEL_BUCKET
served_name: qwen3-35b-nvfp4                  # --served-model-name passed to vLLM
port_forward_port: "8082"                     # local port for kubectl port-forward
benchmark_manifest: configs/manifests/qwen3-35b-nvfp4-baseline.yaml

# ── Download ──────────────────────────────────────────────────────────────────
download:
  size_gb: 20
  tmp_size_gi: 50                             # emptyDir for staging before S3 upload
  gated: true                                 # requires HF token + NVIDIA org access

# ── Serving ───────────────────────────────────────────────────────────────────
serving:
  gpu_memory_utilization: "0.85"
  max_model_len: "8192"
  max_num_seqs: "128"
  max_num_batched_tokens: "2048"
  quantization: "nvfp4"                       # NVFP4 requires vLLM 0.8.5+ + Ada/Hopper GPU
  load_format: "runai_streamer"
  extra_args:
    - "--trust-remote-code"
    - "--enable-chunked-prefill"
    - "--enable-prefix-caching"

# ── Kubernetes resources ───────────────────────────────────────────────────────
resources:
  cpu_request: "4"
  cpu_limit: "8"
  memory_request: "24Gi"
  memory_limit: "32Gi"
  gpu: "1"
  pvc_storage: "5Gi"
  tmp_size: "4Gi"
  dshm_size: "16Gi"

# ── Probes ────────────────────────────────────────────────────────────────────
probes:
  readiness_initial_delay_s: 360
  liveness_initial_delay_s: 420
  termination_grace_period_s: 120

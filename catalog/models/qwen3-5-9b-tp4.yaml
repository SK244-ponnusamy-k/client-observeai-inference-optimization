id: qwen3-5-9b-tp4
display_name: qwen3-5-9b-tp4
hardware: gpu
source:
  hf_id: Qwen/Qwen3.5-9B
  gated: false
  size_gb: 20.0
  s3_folder: qwen3-5-9b-tp1
serving:
  quantization: none
  max_model_len: 16384
  extra_args:
    # Run WITHOUT reasoning. Qwen3.5 has thinking ON by default in its chat
    # template, so disabling reasoning needs BOTH of:
    #   1. NOT loading the qwen3 reasoning parser (no <think> splitting), and
    #   2. a server-side default that turns thinking OFF for every request.
    # The benchmark harness uses `vllm bench serve` -> /v1/chat/completions and
    # sends NO per-request chat_template_kwargs, so the OFF switch must live on
    # the server. --chat-template-kwargs sets that default (request values still
    # win if ever provided). Without it, the model keeps emitting <think> blocks
    # and burns output tokens even though nothing parses them.
    #
    # NOTE on quoting: the generator wraps each extra arg in double quotes in the
    # rendered deployment.yaml (- "<arg>"). The JSON value needs double quotes on
    # its key, so they are pre-escaped as \" here to stay valid YAML after render.
    - '--chat-template-kwargs={\"enable_thinking\": false}'
instances:
  candidates:
  - g6.12xlarge
  - g5.12xlarge
  tensor_parallel_size: 4
benchmark:
  auto: true
  instance_hourly_usd: 0.0
resources:
  cpu_request: "8"
  cpu_limit: "16"
  memory_request: "64Gi"
  memory_limit: "120Gi"


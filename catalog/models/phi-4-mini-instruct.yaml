id: phi-4-mini-instruct
display_name: Phi-4-mini-instruct
hardware: gpu
source:
  hf_id: microsoft/Phi-4-mini-instruct
  gated: false
  size_gb: 10.0
serving:
  quantization: none
  max_model_len: 16384
  extra_args:
    # Run WITHOUT reasoning. This is the plain -instruct variant (NOT
    # microsoft/Phi-4-mini-reasoning). The thinking-off default is set on the
    # server because the benchmark harness (`vllm bench serve` ->
    # /v1/chat/completions) sends no per-request chat_template_kwargs. If this
    # template does not read enable_thinking, vLLM ignores the unknown kwarg
    # (harmless no-op); if it does, thinking is forced off. Either way the run
    # stays non-reasoning.
    - '--chat-template-kwargs={\"enable_thinking\": false}'
instances:
  candidates:
  - g6e.2xlarge
  - g6.2xlarge
  - g7e.2xlarge
  - g5.2xlarge
  tensor_parallel_size: 1
benchmark:
  auto: false
  instance_hourly_usd: 0.0

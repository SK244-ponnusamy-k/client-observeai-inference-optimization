# catalog/models/phi-4-mini-instruct.yaml
# Created by 'oai model new'. Edit freely; see catalog/SCHEMA.md for all options.

id: phi-4-mini-instruct
display_name: Phi-4-mini-instruct
hardware: gpu
source:
  hf_id: microsoft/Phi-4-mini-instruct
  gated: false
  size_gb: 10.0
serving:
  quantization: none
  max_model_len: 16384
  extra_args:
    # Attempt to run WITH reasoning (flipped from the previous OFF run).
    # IMPORTANT CAVEAT: this is the plain -instruct variant (NOT
    # microsoft/Phi-4-mini-reasoning), which has no native thinking mode. Setting
    # enable_thinking: true is very likely a NO-OP here — if the chat template
    # does not read the kwarg, vLLM ignores it and the model produces no
    # chain-of-thought, so the inference probe will still record
    # reasoning_observed=OFF. No reasoning parser is loaded because -instruct
    # emits no <think> blocks to parse. To genuinely get phi reasoning ON, switch
    # source.hf_id to microsoft/Phi-4-mini-reasoning and add its reasoning parser.
    # This flip is kept for parity with the qwen/gemma opposite-run config; expect
    # the observed status to remain OFF until the model itself is changed.
    - '--default-chat-template-kwargs={\"enable_thinking\": true}'
instances:
  candidates:
  - g6e.2xlarge
  - g6.2xlarge
  - g7e.2xlarge
  - g5.2xlarge
  tensor_parallel_size: 1
benchmark:
  auto: false
  instance_hourly_usd: 0.0
